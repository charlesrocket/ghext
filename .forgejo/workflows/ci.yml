---
name: CI
"on": [push, pull_request]

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: Test | ${{ matrix.mode }}
    strategy:
      matrix:
        mode: ["fast", "safe", "small", "off"]

    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: https://github.com/goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build --release=${{ matrix.mode }} --verbose --summary all
      - name: Test
        run: zig build test --release=${{ matrix.mode }} --summary all

  lint:
    name: Format
    runs-on: codeberg-tiny
    if: forgejo.ref_type != 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: https://github.com/goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check format
        run: zig fmt --check .

  release:
    name: Create release
    needs: test
    uses: charlesrocket/reusable/.forgejo/workflows/release.yml@trunk
    with:
      skip-assets: true
